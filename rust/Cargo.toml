[package]
name = "meeng-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Meeng.dev's SDK for Rust: emails, domains, contacts, contact books, campaigns, analytics and webhooks."
license = "MIT"
homepage = "https://meeng.dev"
repository = "https://github.com/meeng-dev/sdk"
documentation = "https://docs.rs/meeng-sdk"
readme = "README.md"
keywords = ["meeng", "email", "smtp", "api", "webhooks"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
# The crate is meeng-sdk; the code says `use meeng::…`.
name = "meeng"

[dependencies]
hmac = "0.13"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.100"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
